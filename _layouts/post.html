---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    </p>
  </header>
  <div class="post-content">
    {%- assign body = content -%}
    {%- unless body contains "<h2" -%}
      {%- assign body = body | replace: "<h3", '<h2 class="as-h3"' | replace: "</h3>", "</h2>" | replace: "<h4", "<h3" | replace: "</h4>", "</h3>" -%}
    {%- endunless %}
    {{ body }}
  </div>
  <footer class="post-footer">
    <p><a href="/news">&larr; All releases</a></p>
  </footer>
</article>
